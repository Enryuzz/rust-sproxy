[package]
name = "rust-sproxy"
version = "0.1.0"
edition = "2021"
description = "A SOCKS5 server that dynamically chains connections through HTTP, SOCKS4, or SOCKS5 upstream proxies"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
